name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck et tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: drivetn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d drivetn_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql://test:test@localhost:5432/drivetn_test
      E2E_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm codegen
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - name: Migrer la base de test
        run: pnpm --filter @drivetn/api prisma:deploy
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
      - run: pnpm test

  docker:
    name: Build Docker et smoke test
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Préparer l'environnement
        run: cp .env.example .env

      - name: Construire les images
        run: docker compose build

      - name: Démarrer la pile
        run: docker compose up -d

      - name: Vérifier la santé de l'API et des portails
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost/api/v1/health | grep -q '"status":"ok"'; then break; fi
            sleep 5
          done
          curl -fsS http://localhost/api/v1/health | grep -q '"status":"ok"'
          curl -fsS http://localhost/api/v1/locations/governorates | grep -q '"code":"11"'
          curl -fsS http://localhost/ | grep -q 'Espace client'
          curl -fsS http://localhost/login | grep -q 'Connexion'
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: agency.localhost' http://localhost/)" = 307
          curl -fsS -H 'Host: agency.localhost' http://localhost/login | grep -q 'Espace agence'
          curl -fsS -H 'Host: admin.localhost' http://localhost/login | grep -q 'Administration'
          curl -fsS -X POST -H 'Content-Type: application/json' \
            -d '{"identifier":"customer@demo.tn","password":"Demo2026!"}' \
            http://localhost/api/v1/auth/login | grep -q '"status":"authenticated"'

      - name: Logs en cas d'échec
        if: failure()
        run: docker compose logs --tail=200

      - name: Arrêter la pile
        if: always()
        run: docker compose down --volumes
