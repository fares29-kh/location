name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm codegen
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test

  docker:
    name: Build Docker et smoke test
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Préparer l'environnement
        run: cp .env.example .env

      - name: Construire les images
        run: docker compose build

      - name: Démarrer la pile
        run: docker compose up -d

      - name: Vérifier la santé de l'API et des portails
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost/api/v1/health | grep -q '"status":"ok"'; then break; fi
            sleep 5
          done
          curl -fsS http://localhost/api/v1/health | grep -q '"status":"ok"'
          curl -fsS -H 'Host: agency.localhost' http://localhost/ | grep -q 'Portail agence'
          curl -fsS -H 'Host: admin.localhost' http://localhost/ | grep -q 'Portail administrateur'
          curl -fsS http://localhost/ | grep -q 'Portail client'

      - name: Logs en cas d'échec
        if: failure()
        run: docker compose logs --tail=200

      - name: Arrêter la pile
        if: always()
        run: docker compose down --volumes
