apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: drivetn
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        app.kubernetes.io/part-of: drivetn
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: worker
          image: drivetn-api:local
          args: ['node', 'dist/worker.js']
          envFrom:
            - secretRef:
                name: drivetn-env
          env:
            - name: RUN_MIGRATIONS
              value: 'false'
            - name: SEED_ON_START
              value: 'false'
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
