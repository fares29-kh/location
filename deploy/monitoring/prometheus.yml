global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: traefik
    static_configs:
      - targets: ['traefik:8082']

  # Cibles HTTPS écrites par deploy/scripts/up.sh (domaine du .env).
  # Le contrôle joint Traefik sur le réseau Docker, avec le nom du certificat.
  - job_name: https
    metrics_path: /probe
    scrape_interval: 60s
    scrape_timeout: 15s
    file_sd_configs:
      - files: ['/etc/prometheus/targets/https.yml']
        refresh_interval: 1m
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [module]
        target_label: __param_module
      - source_labels: [site]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
